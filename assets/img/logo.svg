<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 56" fill="none" class="weston-logo" role="img" aria-label="weston logo">
  <defs>
    <linearGradient id="wl-grad" x1="0" y1="0" x2="96" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.55" stop-color="#3b9cf5"/>
      <stop offset="1" stop-color="#45e0c8"/>
    </linearGradient>
    <filter id="wl-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- الشبكة الداخلية -->
  <g stroke="url(#wl-grad)" stroke-width="1.1" opacity="0.55" class="wl-faint">
    <path d="M8 8 L48 20 L88 8"/>
    <path d="M30 48 L48 20 L66 48"/>
    <path d="M8 8 L66 48"/>
    <path d="M88 8 L30 48"/>
    <path d="M8 8 L88 8"/>
    <path d="M30 48 L66 48"/>
  </g>

  <!-- خطوط حرف W -->
  <g stroke="url(#wl-grad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#wl-glow)" class="wl-lines">
    <path d="M8 8 L30 48 L48 20 L66 48 L88 8"/>
  </g>

  <!-- العقد -->
  <g class="wl-nodes" filter="url(#wl-glow)">
    <circle cx="8" cy="8" r="4" fill="#2f6ff0"/>
    <circle cx="30" cy="48" r="4.6" fill="#2f8df0"/>
    <circle cx="48" cy="20" r="4.2" fill="#3aa8e0"/>
    <circle cx="66" cy="48" r="4.6" fill="#3cc8d8"/>
    <circle cx="88" cy="8" r="4" fill="#45e0c8"/>
  </g>
</svg>
